{% extends "base.html" %}

{% block content %}

<div class="row g-4">

  <!-- FORMULÁRIO -->
  <div class="col-lg-4">
    <div class="card overflow-hidden">

      <div class="card-form-header">
        <h3><i class="bi bi-credit-card me-2"></i>Nova Forma de Pagamento</h3>
        <p>Cadastre como você realiza seus <br> pagamentos ou recebimentos.</p>
        <span class="header-icon">💳</span>
      </div>

      <div class="card-body-form">
        <form method="POST" action="{% if pagamento %}{{ url_for('pagamentos', id=pagamento.id) }}{% else %}{{ url_for('pagamentos') }}{% endif %}">

          <div class="mb-4">
            <label class="form-label">Nome da forma</label>
            <input
              type="text"
              name="nome"
              class="form-control"
              value="{{ pagamento.nome if pagamento else '' }}"
              placeholder="Ex: Cartão de crédito, Pix, Dinheiro"
              required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-custom">
              <i class="bi bi-check2-circle me-2"></i>Salvar
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <!-- TABELA -->
  <div class="col-lg-8">
    <div class="section-title">
      <span class="title-pill"></span>
      Formas de pagamento cadastradas
    </div>

    <div class="table-wrapper">
      <table id="tabela-pagamentos" class="table table-striped text-center">
        <thead>
          <tr>
            <th class="text-center sortable" data-col="0">Nome <i class="bi bi-chevron-expand sort-icon"></i></th>
            <th colspan="2">Ações</th>
          </tr>
        </thead>
        <tbody>
          {% for pag in pagamentos %}
            <tr>
              <td class="text-center fw-500">{{ pag.nome }}</td>
              <td>
                <a class="table-action" href="{{ url_for('pagamentos', id=pag.id) }}" title="Editar">
                  <i class="bi bi-pencil"></i>
                </a>
              </td>
              <td>
                <a class="table-action delete" href="{{ url_for('pagamentos', delete_pagamento=pag.id) }}" onclick="return confirm('Tem certeza?')" title="Excluir">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  const tabela  = document.getElementById('tabela-pagamentos')
  const tbody   = tabela.querySelector('tbody')
  let ultimaCol = -1
  let ordemAsc  = true

  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = parseInt(th.dataset.col)

      if (ultimaCol === col) {
        ordemAsc = !ordemAsc
      } else {
        ordemAsc  = true
        ultimaCol = col
      }

      document.querySelectorAll('th.sortable .sort-icon').forEach(i => {
        i.className = 'bi bi-chevron-expand sort-icon'
      })
      th.querySelector('.sort-icon').className = ordemAsc
        ? 'bi bi-chevron-up sort-icon'
        : 'bi bi-chevron-down sort-icon'

      const linhas = Array.from(tbody.querySelectorAll('tr'))
      linhas.sort((a, b) => {
        const textoA = a.cells[col]?.innerText.trim().toLowerCase() || ''
        const textoB = b.cells[col]?.innerText.trim().toLowerCase() || ''
        return ordemAsc
          ? textoA.localeCompare(textoB, 'pt-BR')
          : textoB.localeCompare(textoA, 'pt-BR')
      })
      linhas.forEach(linha => tbody.appendChild(linha))
    })
  })
</script>

{% endblock %}
