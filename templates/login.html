<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Controle Financeiro</title>
    <link rel="icon" href="/static/img/icon_login.png">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>

  <body style="min-height: 100vh; display: flex; flex-direction: column">
    <!-- Fundo com hero igual ao index -->
    <div
      class="hero"
      style="
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
      "
    >
      <div
        style="width: 100%; max-width: 400px; position: relative; z-index: 1"
      >
        <!-- Logo -->
        <div class="text-center mb-4">
          <div
            style="
              display: inline-flex;
              align-items: center;
              gap: 0.5rem;
              color: white;
            "
          >
            <span
              class="brand-icon"
              style="
                background: rgba(0, 168, 232, 0.2);
                border-radius: 8px;
                padding: 6px 10px;
                font-size: 1.3rem;
              "
              >💰</span
            >
            <span
              style="
                font-size: 1.2rem;
                font-weight: 700;
                letter-spacing: -0.02em;
              "
              >Controle Financeiro</span
            >
          </div>
          <p
            style="
              color: rgba(255, 255, 255, 0.7);
              font-size: 0.875rem;
              margin-top: 8px;
            "
          >
            Digite sua senha para continuar
          </p>
        </div>

        <!-- Card de login -->
        <div class="card" style="border: none">
          <div class="card-body-form">
            {% with messages = get_flashed_messages(with_categories=true) %} {%
            if messages %} {% for category, message in messages %}
            <div
              class="alert alert-danger d-flex align-items-center gap-2 mb-3 py-2"
              style="font-size: 0.875rem; border-radius: var(--r-sm)"
            >
              <i class="bi bi-exclamation-circle"></i>
              {{ message }}
            </div>
            {% endfor %} {% endif %} {% endwith %}

            <form method="POST" action="/login">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  name="senha"
                  id="senha"
                  class="form-control"
                  placeholder="Digite sua senha"
                  autofocus
                  required
                  style="border-left: none; border-radius: 0 !important"
                />
                <button
                  type="button"
                  class="input-group-text"
                  onclick="toggleSenha()"
                  style="
                    cursor: pointer;
                    border-left: none;
                    border-radius: 0 var(--r-sm) var(--r-sm) 0 !important;
                  "
                >
                  <i class="bi bi-eye" id="icone-olho"></i>
                </button>
              </div>

              <div class="d-grid mt-3">
                <button type="submit" class="btn btn-custom">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleSenha() {
        const input = document.getElementById("senha");
        const icone = document.getElementById("icone-olho");
        if (input.type === "password") {
          input.type = "text";
          icone.className = "bi bi-eye-slash";
        } else {
          input.type = "password";
          icone.className = "bi bi-eye";
        }
      }
    </script>
  </body>
</html>
