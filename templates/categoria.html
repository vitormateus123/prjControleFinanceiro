{% extends "base.html" %}

{% block content %}

<div class="row g-4">

  <!-- FORMULÁRIO -->
  <div class="col-lg-4">
    <div class="card overflow-hidden">

      <div class="card-form-header">
        <h3><i class="bi bi-tag me-2"></i>Nova Categoria</h3>
        <p>Informe de onde vem ou para onde vai seu dinheiro.</p>
        <span class="header-icon">🏷️</span>
      </div>

      <div class="card-body-form">
        <form method="POST" action="{% if categoria %}{{ url_for('categorias', id=categoria.id) }}{% else %}{{ url_for('categorias') }}{% endif %}">

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" name="nome" value="{{ categoria.nome if categoria else '' }}" class="form-control" placeholder="Ex: Alimentação, Salário..." required>
          </div>

          <div class="mb-4">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" required>
              <option value="entrada" {% if categoria and categoria.tipo == "entrada" %}selected{% endif %}>📈 Entrada</option>
              <option value="saida"   {% if categoria and categoria.tipo == "saida"   %}selected{% endif %}>📉 Saída</option>
            </select>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-custom">
              <i class="bi bi-check2-circle me-2"></i>Salvar Categoria
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <!-- TABELA -->
  <div class="col-lg-8">
    <div class="section-title">
      <span class="title-pill"></span>
      Categorias cadastradas
    </div>

    <div class="table-wrapper">
      <table id="tabela-categorias" class="table table-striped text-center">
        <thead>
          <tr>
            <th class="text-center sortable" data-col="0">Nome <i class="bi bi-chevron-expand sort-icon"></i></th>
            <th class="sortable" data-col="1">Tipo <i class="bi bi-chevron-expand sort-icon"></i></th>
            <th colspan="2">Ações</th>
          </tr>
        </thead>
        <tbody>
          {% for cat in categorias %}
            <tr>
              <td class="text-center fw-500">{{ cat.nome }}</td>
              <td>
                {% if cat.tipo == "entrada" %}
                  <span class="badge-entrada">Entrada</span>
                {% else %}
                  <span class="badge-saida">Saída</span>
                {% endif %}
              </td>
              <td>
                <a class="table-action" href="{{ url_for('categorias', id=cat.id) }}" title="Editar">
                  <i class="bi bi-pencil"></i>
                </a>
              </td>
              <td>
                <a class="table-action delete" href="{{ url_for('categorias', delete_categoria=cat.id) }}" onclick="return confirm('Tem certeza?')" title="Excluir">
                  <i class="bi bi-trash"></i>
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  const tabela  = document.getElementById('tabela-categorias')
  const tbody   = tabela.querySelector('tbody')
  let ultimaCol = -1
  let ordemAsc  = true

  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const col = parseInt(th.dataset.col)

      if (ultimaCol === col) {
        ordemAsc = !ordemAsc
      } else {
        ordemAsc  = true
        ultimaCol = col
      }

      document.querySelectorAll('th.sortable .sort-icon').forEach(i => {
        i.className = 'bi bi-chevron-expand sort-icon'
      })
      th.querySelector('.sort-icon').className = ordemAsc
        ? 'bi bi-chevron-up sort-icon'
        : 'bi bi-chevron-down sort-icon'

      const linhas = Array.from(tbody.querySelectorAll('tr'))
      linhas.sort((a, b) => {
        const textoA = a.cells[col]?.innerText.trim().toLowerCase() || ''
        const textoB = b.cells[col]?.innerText.trim().toLowerCase() || ''
        return ordemAsc
          ? textoA.localeCompare(textoB, 'pt-BR')
          : textoB.localeCompare(textoA, 'pt-BR')
      })
      linhas.forEach(linha => tbody.appendChild(linha))
    })
  })
</script>

{% endblock %}
