{% extends "base.html" %}

{% block content %}

<!-- FORMULÁRIO -->
<div class="container container-form">
    <form method="POST" action="/categorias" class="card p-4">

      <div class="text-center">
        <h3 class="mb-2 fw-semibold">Nova Categoria</h3>
        <p class="text-muted">Informe de onde vem ou para onde vai seu dinheiro.</p>
      </div>

      <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" name="nome" class="form-control" required>
      </div>

      <div class="mb-3">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select" required>
              <option value="entrada">Entrada</option>
              <option value="saida">Saída</option>
          </select>
      </div>

      <button type="submit" class="btn btn-custom w-100">Salvar</button>

    </form>
</div>

{% endblock %}
